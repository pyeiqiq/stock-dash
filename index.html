<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 股票模拟盘 · 已下线</title>
<style>
  :root{--navy:#0a1838;--navy2:#0e2247;--gold:#c9a24b;--ink:#e8eef7;--muted:#9fb0c9}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(160deg,var(--navy),var(--navy2));color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:rgba(255,255,255,.04);border:1px solid rgba(201,162,75,.35);border-radius:16px;padding:40px 36px;max-width:520px;text-align:center;backdrop-filter:blur(6px)}
  .tag{display:inline-block;font-size:12px;letter-spacing:2px;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:4px 14px;margin-bottom:20px}
  h1{font-size:22px;font-weight:600;margin-bottom:12px}
  p{color:var(--muted);line-height:1.7;font-size:14.5px;margin-bottom:14px}
  code{color:var(--gold);background:rgba(201,162,75,.08);padding:2px 7px;border-radius:5px;font-size:13px}
  .dot{width:10px;height:10px;border-radius:50%;background:#e0533d;display:inline-block;margin-right:8px;vertical-align:middle}
  .foot{margin-top:22px;font-size:12px;color:#6f819c}
</style>
</head>
<body>
  <div class="card">
    <span class="tag">STOCK · MIAODOU</span>
    <h1><span class="dot"></span>在线服务已下线</h1>
    <p>AI 股票模拟盘系统的云端在线版本已于 2026-09-10 下架，现转本地运行与调试。</p>
    <p>你的历史数据（持仓、交易、灾备快照）均保留在云端，不会丢失；后续重新上线时将自动恢复。</p>
    <p>本地运行命令：<br><code>python backend/server.py</code><br>然后访问 <code>http://localhost:8000</code></p>
    <div class="foot">如有疑问，请联系系统管理员。</div>
  </div>
</body>
</html>
